name: Lean and browser WASM

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  lean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install browser test dependency
        run: npm install --no-save jsdom
      - name: Test native browser editor
        run: node web/test_frontend.js
      - name: Test two-client collaboration server
        run: python3 web/test_collaboration.py

  browser-wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: npm run wasm:build
